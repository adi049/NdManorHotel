name: Website CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ndmanor_work
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      NEXT_PUBLIC_SITE_URL: https://www.ndmanor.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
